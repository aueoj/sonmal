<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>손말</title>
<meta name="description" content="말한 문장을 한글 지문자로 보여주고, 따라한 손모양을 다시 말로 읽어주는 연습 도구.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip" href="#coach">코치 패널로 건너뛰기</a>

<header class="bar">
  <div class="brand">
    <span class="mark">손말</span>
    <span class="sub">한글 지문자 연습</span>
  </div>
  <div class="bar-right">
    <button class="ghost" id="btn-sources" type="button">자료 출처</button>
    <span class="status" id="cam-status" data-state="off"><i></i><span>카메라 꺼짐</span></span>
  </div>
</header>

<main class="stage">
  <section class="camera" aria-label="카메라">
    <video id="cam" playsinline muted></video>
    <canvas id="overlay"></canvas>

    <div class="cam-empty" id="cam-empty">
      <div class="cam-prompt">
        <div>
          <p class="cam-empty-title">카메라를 켜면 손모양을 봐 드립니다</p>
          <p class="cam-empty-body">영상과 손 좌표는 이 브라우저 안에서만 처리되고 어디로도 전송되지 않습니다.</p>
        </div>
        <div class="cam-actions">
          <button class="primary" id="btn-cam" type="button">카메라 켜기</button>
          <button class="ghost" id="btn-demo" type="button">카메라 없이 둘러보기</button>
        </div>
      </div>
      <div class="diag" id="diag" hidden>
        <p class="diag-verdict" id="diag-verdict"></p>
        <ul class="diag-list" id="diag-list"></ul>
        <p class="diag-advice" id="diag-advice"></p>
        <div class="cam-actions">
          <button class="primary" id="diag-retry" type="button">다시 시도</button>
          <button class="ghost" id="diag-newtab" type="button" hidden>새 탭에서 열기</button>
        </div>
      </div>
      <div class="chart" id="chart"></div>
    </div>

    <div class="heard" id="heard" hidden>
      <span class="heard-label">들은 말</span>
      <span class="heard-text" id="heard-text"></span>
    </div>
  </section>

  <aside class="rail" id="coach" aria-label="코치">
    <div class="card" id="card">
      <div class="glyph" id="glyph" aria-hidden="true"></div>
      <div class="hand" id="hand"></div>
      <span class="flag" id="flag" hidden>확인 필요</span>
    </div>

    <div class="read">
      <p class="note" id="note">말하기를 누르고 문장을 말해 보세요.</p>
      <p class="mnemo" id="mnemo"></p>
    </div>

    <div class="meter" aria-live="polite">
      <div class="meter-head">
        <span id="meter-label">기다리는 중</span>
        <span class="pct" id="meter-pct">—</span>
      </div>
      <div class="track"><div class="fill" id="meter-fill"></div></div>
      <p class="hint" id="hint"></p>
    </div>

    <dl class="params" id="params">
      <div><dt>수형</dt><dd id="p-shape">—</dd></div>
      <div><dt>수향</dt><dd id="p-view">—</dd></div>
      <div><dt>수동</dt><dd id="p-dir">—</dd></div>
    </dl>
  </aside>
</main>

<section class="strip" aria-label="지문자 시퀀스">
  <div class="strip-rail" id="strip"><p class="strip-empty">아직 말한 문장이 없습니다.</p></div>
  <div class="strip-count" id="count"></div>
</section>

<footer class="controls">
  <button class="primary" id="btn-listen" type="button">말하기 <kbd>Space</kbd></button>
  <form class="typed" id="typed-form">
    <input id="typed" type="text" placeholder="또는 문장을 직접 입력" autocomplete="off" lang="ko">
    <button class="ghost" type="submit">보기</button>
  </form>
  <button class="ghost" id="btn-replay" type="button" disabled>다시 읽어주기</button>
  <span class="spacer"></span>
  <span class="result" id="result"></span>
</footer>

<dialog id="sources" aria-labelledby="sources-title">
  <h2 id="sources-title">이 연습 도구가 선 자리</h2>
  <div id="sources-body"></div>
  <form method="dialog"><button class="primary" type="submit">닫기</button></form>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
