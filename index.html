<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com;
  img-src 'self' data: blob:;
  media-src 'self' blob: mediastream:;
  connect-src 'self' https://cdn.jsdelivr.net https://storage.googleapis.com;
  worker-src 'self' blob:;
  form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>손말</title>
<meta name="description" content="말하거나 손으로 하면 손말이 읽어 줍니다. 한글 지문자와 자주 쓰는 수어 연습.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=202611011549">
<link rel="stylesheet" href="css/app.css?v=202611011549">
</head>
<body>
<script>
if (location.protocol === 'file:') {
  document.documentElement.innerHTML =
    '<head><meta charset="utf-8"><title>손말</title></head><body style="margin:0;font:15px/1.65 system-ui;color:#0d0e11">'
  + '<div style="max-width:60ch;margin:12vh auto;padding:0 24px">'
  + '<h1 style="font-size:21px;letter-spacing:-.02em;margin:0 0 12px">이렇게 열면 동작하지 않습니다</h1>'
  + '<p style="color:#6b6f76;margin:0 0 20px">파일을 직접 여는 <code>file://</code> 방식에서는 브라우저가 스크립트 모듈과 카메라를 막습니다. 작은 서버를 띄워 <code>localhost</code> 로 열어야 합니다.</p>'
  + '<pre style="background:#f7f7f8;border:1px solid #e7e7ea;border-radius:7px;padding:12px 14px;margin:0 0 16px">python3 -m http.server 8000</pre>'
  + '<p style="margin:0">그다음 <b>http://localhost:8000</b> 을 엽니다. 크롬이나 엣지를 쓰세요.</p>'
  + '</div></body>';
}
</script>
<a class="skip" href="#guide">가이드로 건너뛰기</a>

<!-- 위: 연습할 말 고르기. 여기 칩을 누르는 것이 화면에서 유일하게 필요한 클릭이다. -->
<header class="bar">
  <span class="mark">손말</span>
  <nav class="chips" id="chips" aria-label="연습할 말"></nav>
  <div class="bar-end">
    <div class="handswitch" role="radiogroup" aria-label="쓰는 손">
      <button type="button" id="hand-right" role="radio" aria-checked="true">오른손</button>
      <button type="button" id="hand-left" role="radio" aria-checked="false">왼손</button>
    </div>
    <button class="ghost" id="btn-sources" type="button">자료</button>
  </div>
</header>

<!-- 가운데: 카메라가 화면의 주인이다 -->
<main class="camera" id="camera" aria-label="카메라">
  <video id="cam" playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div class="cam-empty" id="cam-empty">
    <div class="cam-prompt">
      <div>
        <p class="cam-title">카메라를 켜면 손을 읽어 드립니다</p>
        <p class="cam-body">영상과 손 좌표는 이 브라우저 안에서만 처리됩니다. 녹화하지 않고 어디로도 보내지 않습니다.
          다만 <b>말하기</b>를 누르면 브라우저가 마이크 소리를 음성 인식 서버로 보냅니다(크롬은 구글, 사파리는 애플).
          소리를 보내고 싶지 않으면 옆 칸에 문장을 입력하세요.</p>
      </div>
      <div class="cam-actions">
        <button class="primary" id="btn-cam" type="button">카메라 켜기</button>
        <button class="ghost" id="btn-demo" type="button">카메라 없이 둘러보기</button>
      </div>
    </div>

    <div class="diag" id="diag" hidden>
      <p class="diag-verdict" id="diag-verdict"></p>
      <ul class="diag-list" id="diag-list"></ul>
      <p class="diag-advice" id="diag-advice"></p>
      <div class="cam-actions">
        <button class="primary" id="diag-retry" type="button">다시 시도</button>
        <button class="ghost" id="diag-newtab" type="button" hidden>새 탭에서 열기</button>
      </div>
    </div>

    <div class="chart" id="chart"></div>
  </div>

  <!-- 읽어 준 말만 영상 위에 잠깐 띄운다 -->
  <p class="spoken" id="spoken" hidden aria-live="polite"></p>

  <!-- 중하단: 말하기. 화면에서 제일 눈에 띄어야 한다 -->
  <form class="say" id="say-form">
    <button class="say-btn" id="btn-listen" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18">
        <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z"/>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
      </svg>
      말하기 <kbd>Space</kbd>
    </button>
    <input id="typed" type="text" placeholder="또는 문장을 입력하고 엔터" autocomplete="off" lang="ko">
  </form>
</main>

<!-- 아래: 가이드. 카메라의 1/3을 넘지 않는다 -->
<section class="guide" id="guide" aria-label="지금 할 동작">
  <figure class="guide-art" id="guide-art" aria-hidden="true"></figure>
  <div class="guide-body">
    <p class="guide-name" id="guide-name">연습할 말을 고르거나 말해 보세요</p>
    <p class="guide-step" id="guide-step"></p>
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
    <p class="seen" id="seen" aria-live="off"></p>
  </div>
  <div class="guide-seq" id="seq"></div>
  <p class="guide-read" id="read"></p>
</section>

<dialog id="sources" aria-labelledby="sources-title">
  <h2 id="sources-title">이 연습 도구가 선 자리</h2>
  <div id="sources-body"></div>
  <form method="dialog"><button class="primary" type="submit">닫기</button></form>
</dialog>

<script type="module" src="js/app.js?v=202611011549"></script>
</body>
</html>
