<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>지문자 컨택트 시트</title>
<style>
 body{margin:0;padding:20px;background:#fff;font:13px/1.5 system-ui;color:#0d0e11}
 .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
 .cell{border-radius:10px;padding:8px 6px 4px;text-align:center}
 .cell.c{background:#e4f0f8} .cell.v{background:#e6f0e4} .cell.m{background:#f0ecf8}
 .cap{font-weight:700;font-size:18px;margin-top:2px}
 .q{font-size:10px;color:#8a7a3a}
 .sm-hand{margin:0;height:96px;display:grid;place-items:center}
 .sm-hand img{height:96px;width:100%;object-fit:contain}
</style></head><body><div class="grid" id="g"></div>
<script type="module">
import {CONSONANTS,VOWELS,MOTION_LETTERS} from '../js/jamoData.js';
const cls=p=>p.motion?'m':(p.kind==='vowel'?'v':'c');
import {renderHand} from '../js/handRenderer.js';
document.getElementById('g').innerHTML=[...CONSONANTS,...VOWELS,...MOTION_LETTERS].map(p=>
 `<div class="cell ${cls(p)}">${renderHand(p,{size:128})}<div class="cap">${p.jamo}</div>
  <div class="q">${p.confidence==='check'?'확인 필요':'&nbsp;'}</div></div>`).join('');
</script></body></html>
