# 푸시할 때마다 스스로 점검한다.
#
# 이 프로젝트는 카메라와 음성을 다루므로, 눈으로 봐서는 알 수 없는 것이 많다.
# 손모양이 서로 구별되는지, 조작 없이 흐르는지, 그림이 늘어나지 않는지,
# 카메라가 막혔을 때 왜 막혔는지 말해 주는지, 그리고 무엇보다 허용한 곳
# 말고 다른 데로 접속하지 않는지를 기계가 본다.
#
# 점검 목록은 dev/verify.mjs 한 곳에 모여 있다. 두 바퀴 돌려서
# 어쩌다 한 번 깨지는 것(간헐 실패)까지 잡는다.
name: 점검

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 브라우저 준비
        run: |
          npm init -y >/dev/null
          npm i -D playwright@1.49.1 >/dev/null
          npm i -D esbuild@0.24.2 >/dev/null
          npx playwright install --with-deps chromium

      - name: 교차검증
        run: node dev/verify.mjs --repeat 2
